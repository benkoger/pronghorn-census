stages:
  - test

pytest-job:
  stage: test
  tags:

  image: python:3.11-slim

rules:
    - if: '$CI_COMMIT_BRANCH == "pytesting"'

  services:
    - name: postgres:18
      alias: db
      variables:
        POSTGRES_USER: $DB_USER
        POSTGRES_PASSWORD: $DB_PASS
        POSTGRES_DB: $DB_NAME
      command: ["postgres", "-c", "listen_addresses=*"]

    - name: docker.io/valkey/valkey:8.1.1
      alias: valkey
      command: ["valkey-server", "--requirepass", "$VALKEY_PASS"]

    - name: authzed/spicedb:latest
      alias: spicedb
      entrypoint: [""]
      command: ["spicedb", "serve", "--grpc-preshared-key", "$SPICEDB_GRPC_PRESHARED_KEY"]

  before_script:
    # 1. System dependencies
    - apt-get update && apt-get install -y postgresql-client curl
    
    # 2. Application Python setup
    - cd airial_api
    - pip install uv
    - uv sync --frozen
    - cd ..

    # 3. Database Restore (Replicating /docker-entrypoint-initdb.d/restore.sh)
    - export PGPASSWORD=$DB_PASS
    - until pg_isready -h $DB_HOST -U $DB_USER -d $DB_NAME; do sleep 2; done
    - chmod +x ./local_db/restore.sh
    - ./local_db/restore.sh

    # 4. SpiceDB Restore (Replicating spicedb-restore container)
    - curl -sSL https://get.zed.dev | sh
    - export PATH="$PATH:$HOME/.zed/bin"
    # Connect zed to the spicedb service and restore the schema backup
    - zed context set ci $SPICE_URL $SPICEDB_GRPC_PRESHARED_KEY --insecure
    - zed backup restore ./local_db/backup.zed

  script:
    - cd airial_api
    - uv run pytest testing/ --cov=app --cov-report=term-missing
